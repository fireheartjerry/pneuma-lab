[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pneuma-lab"
version = "0.1.0"
description = "Standalone research/evaluation harness for machine psyche, SE cognition, continuous affect, instinct, scar-tissue memory, self-modeling, and consciousness-relevant evaluation."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "UNLICENSED" }
# Phase 1 (replay harness + Level-3 psyche exercise) makes frame validation a
# base requirement (evaluation-guide Layer A), so `jsonschema` is now a runtime
# dependency: the harness validates every input and output frame and raises on
# any violation. The psyche math itself is stdlib-only.
# Phase 3 adapters read parquet sources (swe_gym_lite imports pyarrow at module
# scope), so pyarrow is a runtime dependency too.
dependencies = [
    "cryptography==49.0.0",
    "jsonschema>=4.20",
    "numpy>=2.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20",
    "mypy==2.3.0",
    "pyarrow>=15",
    "pytest>=8",
    "ruff==0.15.22",
]
# Grading for the placebo study. `grader.py` imports evalplus lazily, so the rest
# of the package installs and tests without it, but a checkout that has not
# installed this extra CANNOT grade a candidate solution. It was undeclared while
# the attempt-1 sweep ran, which is recorded as a reproducibility defect in
# 15-decision-log.md DL-84. Warm the dataset and ground-truth caches once with:
#   python -c "from evalplus.data import get_human_eval_plus, get_mbpp_plus; \
#              get_human_eval_plus(); get_mbpp_plus()"
placebo = ["evalplus>=0.3"]
foundation = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "bitsandbytes==0.49.2",
    "accelerate==1.14.0",
    "peft==0.19.1",
    "psutil==7.2.2",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "huggingface-hub==1.23.0",
    "transformers @ git+https://github.com/huggingface/transformers.git@11ed2ff4df5fdfb3117f0e3365ef6ad94081ba69",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/smoke"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -p no:cacheprovider -q"
markers = [
    "milestone: bounded NeurIPS execution milestone test",
    "forensic: retained forensic evidence test outside the default smoke suite",
    "qwen_smoke: opt-in smoke test that loads the real pinned Qwen 2B snapshot",
    "foundation: local-Qwen foundation program; frozen and off the NeurIPS paper critical path (auto-applied to test_foundation_*.py, excluded from the default fast loop)",
]
